<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="Reward card — TOP 10 FINALIST, 4TH PLACE OVERALL at DevDay Exchange Metro Hackathon Pune, for MetroMind by Team UrbanSync">
  <defs>
    <linearGradient id="rp-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="rp-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.5" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#e0a52e"/>
    </linearGradient>
    <linearGradient id="rp-shineT" gradientUnits="userSpaceOnUse" x1="310" y1="0" x2="660" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.42" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#fffbe9"/>
      <stop offset="0.58" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ffd166"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-360 0;420 0" dur="4.6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="rp-halo">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.4"/>
      <stop offset="0.7" stop-color="#ffd166" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rp-scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rp-cupClip">
      <rect x="25" y="18" width="110" height="14" rx="7"/>
      <path d="M32 32 h96 v20 c0 30 -21 52 -48 52 s-48 -22 -48 -52 z"/>
    </clipPath>
    <filter id="rp-soft3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <pattern id="rp-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 H0 V28" fill="none" stroke="#121a2b" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .rp-float{transform-box:fill-box;transform-origin:center;animation:rp-float 3.4s ease-in-out infinite alternate}
    .rp-wave{transform-box:fill-box;transform-origin:center;transform:scale(.5);opacity:0;animation:rp-wave 3s ease-out infinite}
    .rp-halo{transform-box:fill-box;transform-origin:center;animation:rp-halo 2.6s ease-in-out infinite alternate}
    .rp-star{transform-box:fill-box;transform-origin:center;animation:rp-star 1.6s ease-in-out infinite alternate}
    .rp-scan{animation:rp-scan 5s linear infinite}
    .rp-bracket{animation:rp-pulse 2.8s ease-in-out infinite alternate}
    .rp-part{transform-box:fill-box;transform-origin:center;opacity:0;animation:rp-rise linear infinite}
    .rp-cursor{animation:rp-blink 1.1s steps(1) infinite}
    @keyframes rp-float{from{transform:translateY(0)}to{transform:translateY(-7px)}}
    @keyframes rp-wave{0%{transform:scale(.5);opacity:.5}70%{opacity:0}100%{transform:scale(2.9);opacity:0}}
    @keyframes rp-halo{from{opacity:.6;transform:scale(.96)}to{opacity:1;transform:scale(1.08)}}
    @keyframes rp-star{from{transform:scale(.85);opacity:.75}to{transform:scale(1.18);opacity:1}}
    @keyframes rp-scan{from{transform:translateY(0)}to{transform:translateY(266px)}}
    @keyframes rp-pulse{from{stroke-opacity:.35}to{stroke-opacity:.95}}
    @keyframes rp-rise{0%{transform:translateY(0);opacity:0}12%{opacity:.9}85%{opacity:.6}100%{transform:translateY(-90px);opacity:0}}
    @keyframes rp-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .rp-float,.rp-wave,.rp-halo,.rp-star,.rp-scan,.rp-bracket,.rp-part,.rp-cursor{animation:none}
      .rp-wave{opacity:0}.rp-part{opacity:.5}.rp-halo{opacity:.85}
    }
  </style>

  <!-- panel -->
  <rect x="20" y="20" width="840" height="320" rx="18" fill="url(#rp-body)" stroke="#1c2a44" stroke-width="1.6"/>
  <rect x="21.5" y="21.5" width="837" height="317" rx="17" fill="url(#rp-grid)" opacity="0.55"/>

  <!-- title bar -->
  <rect x="20" y="20" width="840" height="46" rx="18" fill="#111a2c"/>
  <rect x="20" y="48" width="840" height="18" fill="#111a2c"/>
  <line x1="21" y1="66.5" x2="859" y2="66.5" stroke="#1c2a44" stroke-width="1.2"/>
  <circle cx="52" cy="43" r="7" fill="#ff5f56"/>
  <circle cx="76" cy="43" r="7" fill="#ffbd2e"/>
  <circle cx="100" cy="43" r="7" fill="#27c93f"/>
  <text x="440" y="49" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="15" fill="#8b949e">siddhant@pune — ~/missions/devday-exchange — reward unlocked</text>

  <!-- HUD corner brackets -->
  <g class="rp-bracket" stroke="#00e5ff" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M36 86 v-12 h12"/>
    <path d="M844 86 v-12 h-12"/>
    <path d="M36 296 v-12 h12"/>
    <path d="M844 296 v-12 h-12"/>
  </g>

  <!-- scanline -->
  <rect class="rp-scan" x="21" y="68" width="838" height="26" fill="url(#rp-scan)"/>

  <!-- rising particles behind the trophy -->
  <g fill="#ffd166">
    <circle class="rp-part" cx="92"  cy="290" r="2.4" style="animation-duration:4.2s;animation-delay:.2s"/>
    <circle class="rp-part" cx="132" cy="300" r="1.8" style="animation-duration:5.1s;animation-delay:1.4s"/>
    <circle class="rp-part" cx="176" cy="292" r="2.2" style="animation-duration:4.6s;animation-delay:2.3s"/>
    <circle class="rp-part" cx="222" cy="298" r="1.6" style="animation-duration:5.4s;animation-delay:.8s"/>
    <circle class="rp-part" cx="252" cy="288" r="2"   style="animation-duration:4.9s;animation-delay:1.9s"/>
  </g>

  <!-- ══ the trophy ══ -->
  <circle class="rp-halo" cx="150" cy="196" r="102" fill="url(#rp-halo)"/>
  <circle class="rp-wave" cx="150" cy="171" r="30" fill="none" stroke="#ffd166" stroke-width="2" style="animation-delay:0s"/>
  <circle class="rp-wave" cx="150" cy="171" r="30" fill="none" stroke="#ffd166" stroke-width="2" style="animation-delay:1s"/>
  <circle class="rp-wave" cx="150" cy="171" r="30" fill="none" stroke="#ffd166" stroke-width="2" style="animation-delay:2s"/>

  <g transform="translate(66,102) scale(1.05)">
    <g class="rp-float">
      <path d="M32 44 H14 C2 44 -6 54 -6 64 C-6 78 6 88 24 88" fill="none" stroke="url(#rp-gold)" stroke-width="7" stroke-linecap="round"/>
      <path d="M128 44 H146 C158 44 166 54 166 64 C166 78 154 88 136 88" fill="none" stroke="url(#rp-gold)" stroke-width="7" stroke-linecap="round"/>
      <rect x="25" y="18" width="110" height="14" rx="7" fill="url(#rp-gold)"/>
      <path d="M32 32 h96 v20 c0 30 -21 52 -48 52 s-48 -22 -48 -52 z" fill="url(#rp-gold)"/>
      <polygon class="rp-star" points="80,49 83.3,57.5 92.4,58 85.3,63.7 87.6,72.5 80,67.6 72.4,72.5 74.7,63.7 67.6,58 76.7,57.5" fill="#8a6200" opacity="0.92"/>
      <g clip-path="url(#rp-cupClip)">
        <rect x="-60" y="6" width="34" height="140" fill="#fffbe9" opacity="0.85" filter="url(#rp-soft3)">
          <animate attributeName="x" values="-60;180;-60" dur="4.6s" repeatCount="indefinite"/>
        </rect>
      </g>
      <path d="M72 104 h16 l4 20 h-24 z" fill="url(#rp-gold)"/>
      <rect x="58" y="124" width="44" height="8" rx="3" fill="url(#rp-gold)"/>
      <path d="M50 132 h60 l7 14 h-74 z" fill="url(#rp-gold)"/>
      <rect x="40" y="146" width="80" height="10" rx="4" fill="url(#rp-gold)"/>
      <rect x="30" y="162" width="100" height="20" rx="6" fill="#131a2c" stroke="#ffd166" stroke-opacity="0.75" stroke-width="1.2"/>
      <text x="80" y="177" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="700" letter-spacing="3" fill="#ffd166">04</text>
    </g>
  </g>

  <!-- ══ the reward log ══ -->
  <clipPath id="rp-c1"><rect x="334" y="94" width="0" height="26"><animate attributeName="width" from="0" to="250" dur="0.8s" begin="0.5s" fill="freeze"/></rect></clipPath>
  <text x="334" y="114" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="17" clip-path="url(#rp-c1)"><tspan fill="#39ff14">$</tspan><tspan fill="#e6edf3" dx="9">cat reward.log</tspan></text>

  <clipPath id="rp-c2"><rect x="334" y="126" width="0" height="24"><animate attributeName="width" from="0" to="500" dur="0.9s" begin="1.5s" fill="freeze"/></rect></clipPath>
  <text x="334" y="144" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="17" fill="#8affc1" clip-path="url(#rp-c2)">[✓] MISSION COMPLETE — Codex Dayline · Pune Metro</text>

  <text x="308" y="194" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="34" font-weight="700" letter-spacing="1.5" fill="url(#rp-shineT)">TOP 10 FINALIST</text>
  <text x="308" y="234" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="34" font-weight="700" letter-spacing="1.5" fill="#ff2e97">4TH PLACE OVERALL</text>

  <clipPath id="rp-c3"><rect x="334" y="246" width="0" height="22"><animate attributeName="width" from="0" to="480" dur="0.9s" begin="2.6s" fill="freeze"/></rect></clipPath>
  <text x="334" y="262" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="16.5" fill="#7ee0ff" clip-path="url(#rp-c3)">[✓] MetroMind — AI commute copilot · Pune Metro</text>

  <clipPath id="rp-c4"><rect x="334" y="272" width="0" height="22"><animate attributeName="width" from="0" to="440" dur="0.8s" begin="3.5s" fill="freeze"/></rect></clipPath>
  <text x="334" y="288" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="16.5" fill="#c9a6ff" clip-path="url(#rp-c4)">[✓] Team UrbanSync — Arya · Avani · Siddhant</text>

  <!-- status bar -->
  <line x1="21" y1="305" x2="859" y2="305" stroke="#1c2a44" stroke-width="1.2"/>
  <g font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#5b6b85">
    <text x="40" y="328"><tspan fill="#39ff14">●</tspan> mission: complete</text>
    <text x="212" y="328"><tspan fill="#ffd166">●</tspan> rank: top-10 · 4th overall</text>
    <text x="482" y="328"><tspan fill="#00e5ff">●</tspan> track: urban-mobility</text>
    <text x="820" y="328" text-anchor="end">2026-10-24</text>
  </g>
</svg>

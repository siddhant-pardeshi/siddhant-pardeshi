<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="240" viewBox="0 0 1500 240" role="img" aria-label="Open channel — let's build something great">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="cgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#7cc7ff"/>
      <stop offset="1" stop-color="#c07bff"/>
    </linearGradient>
    <linearGradient id="cglint" x1="0" y1="0" x2="0.3" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bfefff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#ff2e97" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff2e97" stop-opacity="0"/>
    </linearGradient>
    <filter id="csoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="cdots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#243049"/>
    </pattern>
  </defs>

  <!-- panel -->
  <rect x="20" y="20" width="1460" height="200" rx="20" fill="url(#cbg)"/>
  <rect x="20" y="20" width="1460" height="200" rx="20" fill="url(#cdots)" opacity="0.55"/>
  <rect x="20" y="20" width="1460" height="200" rx="20" fill="none" stroke="#1c2a44" stroke-width="1.6"/>

  <!-- glint sweep -->
  <rect x="-300" y="20" width="260" height="200" fill="url(#cglint)">
    <animate attributeName="x" values="-300;1500" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD corner brackets -->
  <g stroke="#00e5ff" stroke-width="3" fill="none" opacity="0.9">
    <path d="M 46 52 L 46 34 L 64 34"/>
    <path d="M 1436 34 L 1454 34 L 1454 52"/>
    <path d="M 46 188 L 46 206 L 64 206"/>
    <path d="M 1436 206 L 1454 206 L 1454 188"/>
  </g>

  <!-- radar pings -->
  <g fill="none" stroke="#00e5ff" stroke-width="2.5">
    <circle cx="160" cy="120" r="12" stroke-opacity="0.9">
      <animate attributeName="r" values="12;58" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.9;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="120" r="12" stroke-opacity="0.9">
      <animate attributeName="r" values="12;58" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.9;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="120" r="12" stroke-opacity="0.9">
      <animate attributeName="r" values="12;58" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.9;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="120" r="20" stroke-opacity="0.35"/>
    <circle cx="160" cy="120" r="38" stroke-opacity="0.18"/>
  </g>
  <circle cx="160" cy="120" r="7" fill="#39ff14">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="160" y="196" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#4fd1c5">LIVE</text>

  <!-- headline -->
  <text x="800" y="112" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-weight="bold" font-size="52" letter-spacing="6" fill="#00e5ff" filter="url(#csoft)" opacity="0.55">
    OPEN CHANNEL
    <animate attributeName="opacity" values="0.35;0.65;0.35" dur="3.6s" repeatCount="indefinite"/>
  </text>
  <text x="800" y="112" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-weight="bold" font-size="52" letter-spacing="6" fill="url(#cgrad)">OPEN CHANNEL</text>

  <rect x="480" y="128" width="640" height="2.2" fill="url(#crule)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="800" y="160" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="20" letter-spacing="4" fill="#8be9fd">
    LET'S BUILD SOMETHING GREAT — ONE COMMIT AT A TIME
    <animate attributeName="opacity" values="0.82;1;0.82" dur="2.8s" repeatCount="indefinite"/>
  </text>

  <text x="800" y="196" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="15" letter-spacing="2" fill="#5b8ba8">// open to opportunities · pune, india · replies within 24h</text>

  <!-- signal bars -->
  <g>
    <rect x="1352" width="11" y="152" height="18" rx="2" fill="#00e5ff">
      <animate attributeName="height" values="18;64;34;72;18" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="152;106;136;98;152" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="1371" width="11" y="136" height="34" rx="2" fill="#58c7ff">
      <animate attributeName="height" values="34;20;70;40;34" dur="1.55s" repeatCount="indefinite"/>
      <animate attributeName="y" values="136;150;100;130;136" dur="1.55s" repeatCount="indefinite"/>
    </rect>
    <rect x="1390" width="11" y="144" height="26" rx="2" fill="#8f9dff">
      <animate attributeName="height" values="26;66;22;58;26" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="y" values="144;104;148;112;144" dur="1.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="1409" width="11" y="122" height="48" rx="2" fill="#bd5fff">
      <animate attributeName="height" values="48;26;74;30;48" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="122;144;96;140;122" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="1428" width="11" y="112" height="58" rx="2" fill="#ff2e97">
      <animate attributeName="height" values="58;72;28;64;58" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="112;98;142;106;112" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <text x="1396" y="200" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#4fd1c5">SIGNAL</text>
  </g>

  <!-- rising particles -->
  <g fill="#00e5ff">
    <circle cx="420" r="2.5" cy="210" opacity="0">
      <animate attributeName="cy" values="210;40" dur="7s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="7s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" r="2" cy="210" fill="#bd5fff" opacity="0">
      <animate attributeName="cy" values="210;40" dur="8.5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="8.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" r="3" cy="210" opacity="0">
      <animate attributeName="cy" values="210;40" dur="6.2s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="6.2s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" r="2" cy="210" fill="#ff2e97" opacity="0">
      <animate attributeName="cy" values="210;40" dur="7.8s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="7.8s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1290" r="2.5" cy="210" opacity="0">
      <animate attributeName="cy" values="210;40" dur="9s" begin="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.65;0" dur="9s" begin="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

  <text x="68" y="143" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="19" fill="#7ee0ff" clip-path="url(#c2)">siddhant-pardeshi · Software Developer — Java · Spring Boot</text>

  <!-- L3 : $ cat focus.txt -->
  <clipPath id="c3"><rect x="44" y="152" width="0" height="30"><animate attributeName="width" from="0" to="330" dur="0.9s" begin="2.9s" fill="freeze"/></rect></clipPath>
  <text x="48" y="176" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="19" clip-path="url(#c3)"><tspan fill="#39ff14">$</tspan><tspan fill="#e6edf3" dx="10">cat focus.txt</tspan></text>


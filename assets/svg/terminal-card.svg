  <circle cx="76" cy="43" r="7" fill="#ffbd2e"/>
  <circle cx="100" cy="43" r="7" fill="#27c93f"/>
  <text x="440" y="49" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="15" fill="#8b949e">siddhant@pune — ~/career — bash</text>

  <!-- L1 : $ whoami -->
  <clipPath id="c1"><rect x="44" y="86" width="0" height="30"><animate attributeName="width" from="0" to="210" dur="0.8s" begin="0.4s" fill="freeze"/></rect></clipPath>
  <text x="48" y="110" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="19" clip-path="url(#c1)"><tspan fill="#39ff14">$</tspan><tspan fill="#e6edf3" dx="10">whoami</tspan></text>

  <!-- L2 : output -->

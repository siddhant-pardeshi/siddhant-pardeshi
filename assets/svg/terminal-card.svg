  <text x="68" y="374" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="19" fill="#8affc1" clip-path="url(#c9)">[✓] Hackathons — FUSION 2026 · FlytBase THC · UI-Testing Award</text>

  <!-- L10 : final prompt + blinking cursor -->

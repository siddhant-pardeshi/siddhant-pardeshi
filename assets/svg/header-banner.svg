<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430" role="img" aria-label="Siddhant Pardeshi — Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#7cc7ff"/>
      <stop offset="1" stop-color="#c07bff"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="0.25" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bfefff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#ff2e97" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff2e97" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#243049"/>
    </pattern>
    <clipPath id="hclip"><rect x="26" y="26" width="1448" height="378" rx="20"/></clipPath>
    <clipPath id="subwipe"><rect x="436" y="252" width="0" height="46">
      <animate attributeName="width" from="0" to="628" dur="0.8s" begin="1.7s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <rect x="0" y="0" width="1500" height="430" rx="0" fill="none"/>
  <rect x="26" y="26" width="1448" height="378" rx="20" fill="url(#bg)"/>
  <rect x="26" y="26" width="1448" height="378" rx="20" fill="url(#dots)" opacity="0.55"/>
  <rect x="26" y="26" width="1448" height="378" rx="20" fill="none" stroke="#1c2a44" stroke-width="1.6"/>

  <!-- glint sweep across the panel -->
  <g>
    <rect x="-260" y="26" width="240" height="378" fill="url(#glint)">
      <animate attributeName="x" values="-260;1500" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- scanning line -->
  <rect x="27" y="60" width="1446" height="2" fill="url(#scan)">
    <animate attributeName="y" values="58;386;58" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- rotating rings behind the name (clipped) -->
  <g clip-path="url(#hclip)">
    <g opacity="0.12" stroke="#00e5ff">
      <animateTransform attributeName="transform" type="rotate" from="0 750 205" to="360 750 205" dur="70s" repeatCount="indefinite"/>
      <line x1="750" y1="205" x2="750" y2="-260" stroke-width="30"/>
      <line x1="750" y1="205" x2="750" y2="670" stroke-width="30"/>
      <line x1="750" y1="205" x2="180" y2="205" stroke-width="30"/>
      <line x1="750" y1="205" x2="1320" y2="205" stroke-width="30"/>
      <line x1="750" y1="205" x2="306" y2="-244" stroke-width="30"/>
      <line x1="750" y1="205" x2="1194" y2="654" stroke-width="30"/>
    </g>
    <circle cx="750" cy="205" r="175" fill="none" stroke="#00e5ff" stroke-width="1.6" stroke-dasharray="5 14" opacity="0.22">
      <animateTransform attributeName="transform" type="rotate" from="0 750 205" to="360 750 205" dur="38s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="205" r="232" fill="none" stroke="#bd5fff" stroke-width="1.3" stroke-dasharray="3 18" opacity="0.16">
      <animateTransform attributeName="transform" type="rotate" from="360 750 205" to="0 750 205" dur="55s" repeatCount="indefinite"/>
    </circle>

    <!-- rising particles -->
    <circle cx="220" r="2" cy="400" fill="#00e5ff" opacity="0">
      <animate attributeName="cy" values="400;50" dur="7s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="7s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" r="1.6" cy="400" fill="#bd5fff" opacity="0">
      <animate attributeName="cy" values="400;50" dur="8.4s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="8.4s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" r="2.2" cy="400" fill="#ffd166" opacity="0">
      <animate attributeName="cy" values="400;50" dur="6.4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="6.4s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" r="1.8" cy="400" fill="#00e5ff" opacity="0">
      <animate attributeName="cy" values="400;50" dur="7.6s" begin="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.65;0" dur="7.6s" begin="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1210" r="2" cy="400" fill="#bd5fff" opacity="0">
      <animate attributeName="cy" values="400;50" dur="6.9s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="6.9s" begin="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1390" r="1.6" cy="400" fill="#7ee0ff" opacity="0">
      <animate attributeName="cy" values="400;50" dur="8s" begin="4.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="8s" begin="4.4s" repeatCount="indefinite"/>
    </circle>

    <!-- reveal shockwaves on load -->
    <circle cx="750" cy="205" r="60" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0">
      <animate attributeName="r" values="60;520" dur="1.6s" begin="1.3s" repeatCount="1" fill="freeze"/>
      <animate attributeName="opacity" values="0.55;0" dur="1.6s" begin="1.3s" repeatCount="1" fill="freeze"/>
    </circle>
    <circle cx="750" cy="205" r="60" fill="none" stroke="#bd5fff" stroke-width="1.8" opacity="0">
      <animate attributeName="r" values="60;520" dur="1.6s" begin="1.7s" repeatCount="1" fill="freeze"/>
      <animate attributeName="opacity" values="0.45;0" dur="1.6s" begin="1.7s" repeatCount="1" fill="freeze"/>
    </circle>
  </g>

  <!-- HUD corner brackets (pulsing) -->
  <g stroke="#00e5ff" stroke-width="3" fill="none">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="3s" repeatCount="indefinite"/>
    <path d="M 54 74 L 54 50 L 78 50"/>
    <path d="M 1422 50 L 1446 50 L 1446 74"/>
    <path d="M 54 356 L 54 380 L 78 380"/>
    <path d="M 1422 380 L 1446 380 L 1446 356"/>
  </g>
  <g stroke="#ff2e97" stroke-width="2.4" fill="none" opacity="0.75">
    <path d="M 66 86 L 66 62 L 90 62"/>
    <path d="M 1410 62 L 1434 62 L 1434 86"/>
    <path d="M 66 344 L 66 368 L 90 368"/>
    <path d="M 1410 368 L 1434 368 L 1434 344"/>
  </g>

  <!-- top-left path tag -->
  <text x="100" y="72" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="17" fill="#4fd1c5" opacity="0">
    ~/siddhant-pardeshi
    <animate attributeName="opacity" from="0" to="0.85" dur="0.4s" begin="2.5s" fill="freeze"/>
  </text>

  <!-- chakra glow behind name -->
  <text x="750" y="212" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-weight="bold" font-size="84" letter-spacing="6" fill="#00e5ff" opacity="0" filter="url(#soft)">SIDDHANT PARDESHI
    <animate attributeName="opacity" from="0" to="0.5" dur="0.5s" begin="1.25s" fill="freeze"/>
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="4s" begin="2.8s" repeatCount="indefinite"/>
  </text>

  <!-- per-letter anime drop: SIDDHANT PARDESHI -->
  <g font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-weight="bold" font-size="84" fill="url(#nameGrad)">
    <text x="270.6" y="224" opacity="0">S<animate attributeName="y" values="224;212;212" keyTimes="0;0.7;1" dur="0.45s" begin="0.15s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.15s" fill="freeze"/></text>
    <text x="327.0" y="224" opacity="0">I<animate attributeName="y" values="224;212;212" keyTimes="0;0.7;1" dur="0.45s" begin="0.205s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.205s" fill="freeze"/></text>
    <text x="383.4" y="224" opacity="0">D<animate attributeName="y" values="224;212;212" keyTimes="0;0.7;1" dur="0.45s" begin="0.26s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.26s" fill="freeze"/></text>
    <text x="439.8" y="224" opacity="0">D<animate attributeName="y" values="224;212;212" keyTimes="0;0.7;1" dur="0.45s" begin="0.315s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.315s" fill="freeze"/></text>
    <text x="496.2" y="224" opacity="0">H<animate attributeName="y" values="224;212;212" keyTimes="0;0.7;1" dur="0.45s" begin="0.37s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.37s" fill="freeze"/></text>
    <text x="552.6" y="224" opacity="0">A<animate attributeName="y" values="224;212;212" keyTimes="0;0.7;1" dur="0.45s" begin="0.425s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.425s" fill="freeze"/></text>
    <text x="609.0" y="224" opacity="0">N<animate attributeName="y" values="224;212;212" keyTimes="0;0.7;1" dur="0.45s" begin="0.48s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.48s" fill="freeze"/></text>
    <text x="665.4" y="224" opacity="0">T<animate attributeName="y" values="224;212;212" keyTimes="0;0.7;1" dur="0.45s" begin="0.535s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.535s" fill="freeze"/></text>
    <text x="778.2" y="224" opacity="0">P<animate attributeName="y" values="224;212;212" keyTimes="0;0.7;1" dur="0.45s" begin="0.64s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.64s" fill="freeze"/></text>
    <text x="834.6" y="224" opacity="0">A<animate attributeName="y" values="224;212;212" keyTimes="0;0.7;1" dur="0.45s" begin="0.695s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.695s" fill="freeze"/></text>
    <text x="891.0" y="224" opacity="0">R<animate attributeName="y" values="224;212;212" keyTimes="0;0.7;1" dur="0.45s" begin="0.75s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.75s" fill="freeze"/></text>
    <text x="947.4" y="224" opacity="0">D<animate attributeName="y" values="224;212;212" keyTimes="0;0.7;1" dur="0.45s" begin="0.805s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.805s" fill="freeze"/></text>
    <text x="1003.8" y="224" opacity="0">E<animate attributeName="y" values="224;212;212" keyTimes="0;0.7;1" dur="0.45s" begin="0.86s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.86s" fill="freeze"/></text>
    <text x="1060.2" y="224" opacity="0">S<animate attributeName="y" values="224;212;212" keyTimes="0;0.7;1" dur="0.45s" begin="0.915s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.915s" fill="freeze"/></text>
    <text x="1116.6" y="224" opacity="0">H<animate attributeName="y" values="224;212;212" keyTimes="0;0.7;1" dur="0.45s" begin="0.97s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.97s" fill="freeze"/></text>
    <text x="1173.0" y="224" opacity="0">I<animate attributeName="y" values="224;212;212" keyTimes="0;0.7;1" dur="0.45s" begin="1.025s" fill="freeze"/><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.025s" fill="freeze"/></text>
  </g>

  <!-- RGB glitch ghosts of the name (brief flashes) -->
  <text x="753" y="212" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-weight="bold" font-size="84" letter-spacing="6" fill="#ff2e97" opacity="0">SIDDHANT PARDESHI
    <animate attributeName="opacity" values="0;0;0.4;0;0;0.3;0" keyTimes="0;0.42;0.44;0.46;0.72;0.74;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="747" y="212" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-weight="bold" font-size="84" letter-spacing="6" fill="#00e5ff" opacity="0">SIDDHANT PARDESHI
    <animate attributeName="opacity" values="0;0;0.35;0;0;0.25;0" keyTimes="0;0.43;0.45;0.47;0.73;0.75;1" dur="8s" repeatCount="indefinite"/>
  </text>

  <!-- neon rule -->
  <rect x="330" y="238" width="840" height="2.4" fill="url(#rule)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.9s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="3.2s" begin="2.3s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle (wipes in) -->
  <text x="750" y="286" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="23" letter-spacing="4" fill="#8be9fd" clip-path="url(#subwipe)">SOFTWARE DEVELOPER — JAVA · SPRING BOOT · MYSQL · AWS · REACT
    <animate attributeName="opacity" values="0.82;1;0.82" dur="2.8s" begin="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- status tags -->
  <g font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="18">
    <circle cx="98" cy="340" r="6" fill="#39ff14" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.6s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" begin="2.9s" repeatCount="indefinite"/>
    </circle>
    <text x="116" y="346" fill="#a7f3d0" opacity="0">SYSTEM ONLINE — OPEN TO OPPORTUNITIES
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.6s" fill="freeze"/>
    </text>
    <text x="1400" y="346" text-anchor="end" fill="#67e8f9" opacity="0">// GATE 2025 QUALIFIED · CGPA 8.13/10
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.75s" fill="freeze"/>
    </text>
  </g>
</svg>

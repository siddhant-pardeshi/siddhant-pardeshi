<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430" role="img" aria-label="Siddhant Pardeshi — Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#7cc7ff"/>
      <stop offset="1" stop-color="#c07bff"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="0.25" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bfefff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#ff2e97" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff2e97" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#243049"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1500" height="430" rx="0" fill="none"/>
  <rect x="26" y="26" width="1448" height="378" rx="20" fill="url(#bg)"/>
  <rect x="26" y="26" width="1448" height="378" rx="20" fill="url(#dots)" opacity="0.55"/>
  <rect x="26" y="26" width="1448" height="378" rx="20" fill="none" stroke="#1c2a44" stroke-width="1.6"/>

  <!-- glint sweep across the panel -->
  <g>
    <rect x="-260" y="26" width="240" height="378" fill="url(#glint)">
      <animate attributeName="x" values="-260;1500" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- scanning line -->
  <rect x="27" y="60" width="1446" height="2" fill="url(#scan)">
    <animate attributeName="y" values="58;386;58" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD corner brackets -->
  <g stroke="#00e5ff" stroke-width="3" fill="none" opacity="0.9">
    <path d="M 54 74 L 54 50 L 78 50"/>
    <path d="M 1422 50 L 1446 50 L 1446 74"/>
    <path d="M 54 356 L 54 380 L 78 380"/>
    <path d="M 1422 380 L 1446 380 L 1446 356"/>
  </g>
  <g stroke="#ff2e97" stroke-width="2.4" fill="none" opacity="0.75">
    <path d="M 66 86 L 66 62 L 90 62"/>
    <path d="M 1410 62 L 1434 62 L 1434 86"/>
    <path d="M 66 344 L 66 368 L 90 368"/>
    <path d="M 1410 368 L 1434 368 L 1434 344"/>
  </g>

  <!-- top-left path tag -->
  <text x="100" y="72" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="17" fill="#4fd1c5" opacity="0.85">~/siddhant-pardeshi</text>

  <!-- glowing name -->
  <text x="750" y="212" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-weight="bold" font-size="84" letter-spacing="6" fill="#00e5ff" filter="url(#soft)" opacity="0.55">
    SIDDHANT PARDESHI
    <animate attributeName="opacity" values="0.35;0.65;0.35" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="750" y="212" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-weight="bold" font-size="84" letter-spacing="6" fill="url(#nameGrad)">SIDDHANT PARDESHI</text>

  <!-- neon rule -->
  <rect x="330" y="238" width="840" height="2.4" fill="url(#rule)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="750" y="286" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="23" letter-spacing="4" fill="#8be9fd">
    SOFTWARE DEVELOPER — JAVA · SPRING BOOT · REACT · MYSQL · AWS
    <animate attributeName="opacity" values="0.82;1;0.82" dur="2.8s" repeatCount="indefinite"/>
  </text>

  <!-- status tags -->
  <g font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="18">
    <circle cx="96" cy="340" r="6" fill="#39ff14">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="116" y="346" fill="#a7f3d0">SYSTEM ONLINE — OPEN TO OPPORTUNITIES</text>
    <text x="1400" y="346" text-anchor="end" fill="#67e8f9">// GATE 2025 QUALIFIED · CGPA 8.13/10</text>
  </g>
</svg>

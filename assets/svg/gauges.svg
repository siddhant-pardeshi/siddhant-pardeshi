<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="290" viewBox="0 0 1500 290" role="img" aria-label="Mission telemetry gauges — CGPA 8.13/10, GATE score 370, 18+ REST APIs shipped">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="garc1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#39ff14"/>
    </linearGradient>
    <linearGradient id="garc2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc7ff"/>
      <stop offset="1" stop-color="#bd5fff"/>
    </linearGradient>
    <linearGradient id="garc3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e97"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="gsoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="gdots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#243049"/>
    </pattern>
  </defs>

  <!-- panel -->
  <rect x="20" y="20" width="1460" height="250" rx="20" fill="url(#gbg)"/>
  <rect x="20" y="20" width="1460" height="250" rx="20" fill="url(#gdots)" opacity="0.5"/>
  <rect x="20" y="20" width="1460" height="250" rx="20" fill="none" stroke="#1c2a44" stroke-width="1.6"/>

  <!-- header tag -->
  <circle cx="58" cy="52" r="5" fill="#ff2e97">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="74" y="57" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="15" letter-spacing="3" fill="#8b949e">MISSION TELEMETRY — LIVE READINGS</text>
  <text x="1452" y="57" text-anchor="end" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#4fd1c5">// calibrated 2026</text>

  <!-- ===== GAUGE 1 : CGPA 8.13/10 (81.3%) ===== -->
  <g transform="translate(255, 148)">
    <circle r="88" fill="none" stroke="#131c2e" stroke-width="13"/>
    <g transform="rotate(-90)">
      <circle r="88" fill="none" stroke="url(#garc1)" stroke-width="13" stroke-linecap="round"
              stroke-dasharray="552.9" stroke-dashoffset="552.9" transform="rotate(-4)">
        <animate attributeName="stroke-dashoffset" from="552.9" to="103.4" dur="2.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
        <animate attributeName="filter" values="url(#gsoft)" dur="0.1s" fill="freeze"/>
      </circle>
    </g>
    <circle r="88" fill="none" stroke="url(#garc1)" stroke-width="13" stroke-linecap="round" opacity="0" stroke-dasharray="552.9" stroke-dashoffset="103.4" transform="rotate(-94)">
      <animate attributeName="opacity" values="0;0.35;0.35;0.2" keyTimes="0;0.12;0.85;1" dur="3.2s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <text y="2" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-weight="bold" font-size="42" fill="#e6edf3" opacity="0">
      8.13
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.1s" fill="freeze"/>
    </text>
    <text y="34" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="14" fill="#5b8ba8" opacity="0">
      / 10 · SPPU
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.3s" fill="freeze"/>
    </text>
    <text y="118" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="16" letter-spacing="3" fill="#7ee0ff">CGPA · FIRST CLASS W/ DISTINCTION</text>
  </g>

  <!-- ===== GAUGE 2 : GATE SCORE 370/1000 (37%) ===== -->
  <g transform="translate(750, 148)">
    <circle r="88" fill="none" stroke="#131c2e" stroke-width="13"/>
    <g transform="rotate(-90)">
      <circle r="88" fill="none" stroke="url(#garc2)" stroke-width="13" stroke-linecap="round"
              stroke-dasharray="552.9" stroke-dashoffset="552.9" transform="rotate(-4)">
        <animate attributeName="stroke-dashoffset" from="552.9" to="348.3" dur="2.2s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </circle>
    </g>
    <circle r="88" fill="none" stroke="url(#garc2)" stroke-width="13" stroke-linecap="round" opacity="0" stroke-dasharray="552.9" stroke-dashoffset="348.3" transform="rotate(-94)">
      <animate attributeName="opacity" values="0;0.35;0.35;0.2" keyTimes="0;0.12;0.85;1" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <text y="2" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-weight="bold" font-size="42" fill="#e6edf3" opacity="0">
      370
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.35s" fill="freeze"/>
    </text>
    <text y="34" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="14" fill="#5b8ba8" opacity="0">
      / 1000 · QUALIFIED
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.55s" fill="freeze"/>
    </text>
    <text y="118" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="16" letter-spacing="3" fill="#c9a6ff">GATE 2025 · AIR 18571 / 170,825</text>
  </g>

  <!-- ===== GAUGE 3 : 18+ REST APIs (72%) ===== -->
  <g transform="translate(1245, 148)">
    <circle r="88" fill="none" stroke="#131c2e" stroke-width="13"/>
    <g transform="rotate(-90)">
      <circle r="88" fill="none" stroke="url(#garc3)" stroke-width="13" stroke-linecap="round"
              stroke-dasharray="552.9" stroke-dashoffset="552.9" transform="rotate(-4)">
        <animate attributeName="stroke-dashoffset" from="552.9" to="154.8" dur="2.2s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </circle>
    </g>
    <circle r="88" fill="none" stroke="url(#garc3)" stroke-width="13" stroke-linecap="round" opacity="0" stroke-dasharray="552.9" stroke-dashoffset="154.8" transform="rotate(-94)">
      <animate attributeName="opacity" values="0;0.35;0.35;0.2" keyTimes="0;0.12;0.85;1" dur="3.2s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
    <text y="2" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-weight="bold" font-size="42" fill="#e6edf3" opacity="0">
      18+
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.6s" fill="freeze"/>
    </text>
    <text y="34" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="14" fill="#5b8ba8" opacity="0">
      SHIPPED
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.8s" fill="freeze"/>
    </text>
    <text y="118" text-anchor="middle" font-family="Cascadia Code, Consolas, 'JetBrains Mono', Menlo, monospace" font-size="16" letter-spacing="3" fill="#ff9ec7">REST APIs · SPRING BOOT</text>
  </g>

  <!-- connector dashes between gauges -->
  <g stroke="#1f3a5f" stroke-width="2" stroke-dasharray="4 8">
    <line x1="388" y1="148" x2="612" y2="148"/>
    <line x1="883" y1="148" x2="1107" y2="148"/>
  </g>

  <!-- scan line -->
  <rect x="21" y="40" width="1458" height="1.5" fill="#00e5ff" opacity="0.18">
    <animate attributeName="y" values="40;265;40" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
